name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/deploy-backend-ec2.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend-ec2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies (CI verification)
        working-directory: server
        run: npm ci

      - name: Create backend release archive
        run: |
          set -euo pipefail
          tar -czf sems-server.tar.gz \
            --exclude='node_modules' \
            --exclude='logs' \
            --exclude='uploads' \
            --exclude='.env' \
            -C server .

      - name: Validate deploy secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
        run: |
          set -euo pipefail
          for key in EC2_HOST EC2_USER EC2_SSH_PRIVATE_KEY EC2_APP_DIR; do
            if [ -z "${!key}" ]; then
              echo "Missing required secret: ${key}" >&2
              exit 1
            fi
          done

      - name: Upload release archive to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_SSH_PORT != '' && secrets.EC2_SSH_PORT || '22' }}
          source: sems-server.tar.gz
          target: /tmp

      - name: Deploy on EC2 and restart PM2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_SSH_PORT != '' && secrets.EC2_SSH_PORT || '22' }}
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.EC2_APP_DIR }}"
            SERVICE_NAME="${{ secrets.EC2_SERVICE_NAME != '' && secrets.EC2_SERVICE_NAME || 'sems-server' }}"

            mkdir -p "${APP_DIR}"
            tar -xzf /tmp/sems-server.tar.gz -C "${APP_DIR}"
            rm -f /tmp/sems-server.tar.gz

            cd "${APP_DIR}"
            # Install shared libraries required by headless Chrome/Puppeteer on Ubuntu.
            sudo apt-get update
            sudo apt-get install -y \
              ca-certificates \
              fonts-liberation \
              libasound2 \
              libatk-bridge2.0-0 \
              libatk1.0-0 \
              libcups2 \
              libdbus-1-3 \
              libdrm2 \
              libgbm1 \
              libgtk-3-0 \
              libnspr4 \
              libnss3 \
              libx11-6 \
              libx11-xcb1 \
              libxcb1 \
              libxcomposite1 \
              libxdamage1 \
              libxext6 \
              libxfixes3 \
              libxrandr2 \
              xdg-utils || sudo apt-get install -y \
              ca-certificates \
              fonts-liberation \
              libasound2t64 \
              libatk-bridge2.0-0 \
              libatk1.0-0 \
              libcups2t64 \
              libdbus-1-3 \
              libdrm2 \
              libgbm1 \
              libgtk-3-0 \
              libnspr4 \
              libnss3 \
              libx11-6 \
              libx11-xcb1 \
              libxcb1 \
              libxcomposite1 \
              libxdamage1 \
              libxext6 \
              libxfixes3 \
              libxrandr2 \
              xdg-utils
            npm ci --omit=dev
            mkdir -p logs

            if ! command -v pm2 >/dev/null 2>&1; then
              echo "PM2 is not installed on EC2. Install PM2 first: npm i -g pm2" >&2
              exit 1
            fi

            pm2 startOrReload ecosystem.config.js --only "${SERVICE_NAME}" --update-env \
              || pm2 restart "${SERVICE_NAME}" --update-env \
              || pm2 start ecosystem.config.js --only "${SERVICE_NAME}" --update-env

            pm2 save || true
