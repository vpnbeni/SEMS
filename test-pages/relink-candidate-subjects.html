<!DOCTYPE html>
<html>
<head>
    <title>Re-link Candidate Subjects</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 40px;
            max-width: 800px;
            margin: 0 auto;
        }
        button { 
            padding: 15px 30px; 
            font-size: 16px; 
            background: #4CAF50; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer;
            margin: 10px 0;
        }
        button:hover { background: #45a049; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #result { 
            margin-top: 20px; 
            padding: 20px; 
            background: #f5f5f5; 
            border-radius: 5px;
            white-space: pre-wrap;
        }
        .success { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
        .info { color: blue; }
    </style>
</head>
<body>
    <h1>Re-link Candidate Subjects</h1>
    <p>This will re-link all candidates' subject codes to their actual Subject documents in the database.</p>
    <p><strong>Note:</strong> You must be logged in as an admin for this to work.</p>
    
    <button id="linkBtn" onclick="relinkSubjects()">Re-link All Candidate Subjects</button>
    
    <div id="result"></div>

    <script>
        async function relinkSubjects() {
            const resultDiv = document.getElementById('result')
            const btn = document.getElementById('linkBtn')
            
            const token = localStorage.getItem('token')
            if (!token) {
                resultDiv.innerHTML = '<p class="error">❌ No authentication token found. Please login first.</p>'
                return
            }

            try {
                btn.disabled = true
                resultDiv.innerHTML = '<p class="info">⏳ Linking candidate subjects... Please wait...</p>'

                const response = await fetch('http://localhost:5000/api/candidates/link-subjects', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                })

                const data = await response.json()
                console.log('Response:', data)

                if (response.ok && data.success) {
                    let html = '<p class="success">✅ Successfully linked candidate subjects!</p>'
                    html += '<h3>Results:</h3>'
                    html += `<p>Candidates updated: ${data.data.candidatesUpdated || 0}</p>`
                    html += `<p>Candidates already linked: ${data.data.candidatesAlreadyLinked || 0}</p>`
                    html += `<p>Candidates with issues: ${data.data.candidatesWithIssues || 0}</p>`
                    
                    if (data.data.updateResults && data.data.updateResults.length > 0) {
                        html += '<h4>Details:</h4>'
                        html += '<pre>' + JSON.stringify(data.data.updateResults, null, 2) + '</pre>'
                    }
                    
                    html += '<p class="info">Please refresh the Candidates page to see the updated subjects.</p>'
                    resultDiv.innerHTML = html
                } else {
                    resultDiv.innerHTML = `<p class="error">❌ Error: ${data.message || 'Failed to link subjects'}</p>`
                }
            } catch (error) {
                console.error('Error:', error)
                resultDiv.innerHTML = `<p class="error">❌ Error: ${error.message}</p>`
            } finally {
                btn.disabled = false
            }
        }
    </script>
</body>
</html>
