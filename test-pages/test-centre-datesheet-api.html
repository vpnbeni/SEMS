<!DOCTYPE html>
<html>
<head>
    <title>Test Centre Datesheet API</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
        .subject { margin: 10px 0; padding: 10px; border: 1px solid #ddd; }
        .class-10 { background-color: #e8f5e9; }
        .class-12 { background-color: #f3e5f5; }
    </style>
</head>
<body>
    <h1>Centre Datesheet API Test</h1>
    <button onclick="fetchData()">Fetch Centre Datesheet</button>
    <button onclick="fetchCandidates()">Fetch Candidates</button>
    
    <h2>Results:</h2>
    <div id="results"></div>

    <script>
        async function fetchData() {
            const token = localStorage.getItem('token')
            if (!token) {
                alert('No token found. Please login first.')
                return
            }

            try {
                const response = await fetch('http://localhost:5000/api/datesheets/centre-datesheet?limit=100', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                })

                const data = await response.json()
                console.log('Full response:', data)

                let html = '<h3>Centre Datesheet Data</h3>'
                html += `<p><strong>Total entries:</strong> ${data.meta?.totalCount || 0}</p>`
                html += `<p><strong>Stats:</strong></p>`
                html += `<pre>${JSON.stringify(data.stats, null, 2)}</pre>`

                html += '<h3>Entries (first 20):</h3>'
                
                if (data.data && data.data.length > 0) {
                    data.data.slice(0, 20).forEach((entry, index) => {
                        const classType = entry.subject.class === '10th' ? 'class-10' : 'class-12'
                        html += `<div class="subject ${classType}">`
                        html += `<strong>${index + 1}. ${entry.subject.name} (${entry.subject.code})</strong><br>`
                        html += `Class: ${entry.subject.class}<br>`
                        html += `Date: ${new Date(entry.examDate).toLocaleDateString()}<br>`
                        html += `<strong>Candidates: ${entry.candidateCount || 0}</strong><br>`
                        html += `Rooms: ${entry.roomsNeeded || 0}`
                        html += `</div>`
                    })
                } else {
                    html += '<p>No data found</p>'
                }

                document.getElementById('results').innerHTML = html
            } catch (error) {
                console.error('Error:', error)
                document.getElementById('results').innerHTML = `<p style="color: red;">Error: ${error.message}</p>`
            }
        }

        async function fetchCandidates() {
            const token = localStorage.getItem('token')
            if (!token) {
                alert('No token found. Please login first.')
                return
            }

            try {
                const response = await fetch('http://localhost:5000/api/candidates?limit=1000', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                })

                const data = await response.json()
                console.log('Candidates response:', data)

                let html = '<h3>Candidates Data</h3>'
                html += `<p><strong>Total candidates:</strong> ${data.meta?.totalCount || 0}</p>`
                
                // Count by class
                const classCounts = {}
                if (data.data && data.data.length > 0) {
                    data.data.forEach(candidate => {
                        const cls = candidate.class || 'undefined'
                        classCounts[cls] = (classCounts[cls] || 0) + 1
                    })
                }

                html += '<p><strong>By class:</strong></p>'
                html += '<pre>' + JSON.stringify(classCounts, null, 2) + '</pre>'

                // Check English and Science for class 10
                const class10 = data.data.filter(c => c.class === '10th')
                html += `<p><strong>Class 10th candidates:</strong> ${class10.length}</p>`
                
                let englishCount = 0
                let scienceCount = 0
                const missingEnglish = []
                const missingScience = []

                class10.forEach(candidate => {
                    const subjects = candidate.subjects || []
                    const hasEnglish = subjects.some(s => s.code === '184')
                    const hasScience = subjects.some(s => s.code === '086')
                    
                    if (hasEnglish) englishCount++
                    else missingEnglish.push(candidate.rollNumber)
                    
                    if (hasScience) scienceCount++
                    else missingScience.push(candidate.rollNumber)
                })

                html += `<p><strong>With English (184):</strong> ${englishCount}</p>`
                html += `<p><strong>With Science (086):</strong> ${scienceCount}</p>`

                if (missingEnglish.length > 0) {
                    html += `<p style="color: red;"><strong>Missing English:</strong> ${missingEnglish.join(', ')}</p>`
                }
                if (missingScience.length > 0) {
                    html += `<p style="color: red;"><strong>Missing Science:</strong> ${missingScience.join(', ')}</p>`
                }

                document.getElementById('results').innerHTML = html
            } catch (error) {
                console.error('Error:', error)
                document.getElementById('results').innerHTML = `<p style="color: red;">Error: ${error.message}</p>`
            }
        }
    </script>
</body>
</html>
