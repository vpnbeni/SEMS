<!DOCTYPE html>
<html>
<head>
    <title>Test Subjects API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background: #45a049;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 4px;
            white-space: pre-wrap;
            font-family: monospace;
        }
        .error {
            background: #ffebee;
            color: #c62828;
        }
        .success {
            background: #e8f5e9;
            color: #2e7d32;
        }
    </style>
</head>
<body>
    <h1>Test Subjects API</h1>
    <p>This will fetch subjects from the API and show the actual response.</p>
    
    <button onclick="testAPI()">Fetch Subjects from API</button>
    <button onclick="testAPIWithoutCache()">Fetch (No Cache)</button>
    
    <div id="result"></div>

    <script>
        async function testAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = 'Loading...';
            resultDiv.className = '';
            
            try {
                const token = localStorage.getItem('token');
                const response = await fetch('http://localhost:5000/api/subjects?limit=100', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                resultDiv.className = 'success';
                resultDiv.textContent = `Status: ${response.status}\n\n` +
                    `Subjects Count: ${data.data ? data.data.length : 0}\n\n` +
                    `Full Response:\n${JSON.stringify(data, null, 2)}`;
                    
            } catch (error) {
                resultDiv.className = 'error';
                resultDiv.textContent = `Error: ${error.message}`;
            }
        }

        async function testAPIWithoutCache() {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = 'Loading (no cache)...';
            resultDiv.className = '';
            
            try {
                const token = localStorage.getItem('token');
                const response = await fetch('http://localhost:5000/api/subjects?limit=100&_=' + Date.now(), {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    cache: 'no-store'
                });
                
                const data = await response.json();
                
                resultDiv.className = 'success';
                resultDiv.textContent = `Status: ${response.status}\n\n` +
                    `Subjects Count: ${data.data ? data.data.length : 0}\n\n` +
                    `Full Response:\n${JSON.stringify(data, null, 2)}`;
                    
            } catch (error) {
                resultDiv.className = 'error';
                resultDiv.textContent = `Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
